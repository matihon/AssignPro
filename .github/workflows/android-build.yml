name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: cordova create app com.assignpro.app "Assign Pro"

      - name: Copy HTML into www folder
        run: cp User-2.html app/www/index.html

      - name: Copy icon into resources folder
        run: |
          mkdir -p app/res/icon/android
          cp Screenshot_20260914-194258.jpg app/res/icon/android/icon.png

      - name: Add icon reference to config.xml
        working-directory: app
        run: |
          sed -i '/<\/widget>/i\
          <platform name="android">\
            <icon src="res/icon/android/icon.png" />\
          </platform>' config.xml

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android

      - name: Build APK
        working-directory: app
        run: cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assign-Pro-apk
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
